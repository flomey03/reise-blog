# Declarative deployment for the blog.
#
#   docker compose up -d --build          start (builds the image)
#   docker compose logs -f emdash         logs
#   docker compose down                   stop (the volume survives)
#
# One named volume holds everything the app writes: database, sessions, media
# and the encryption key. Backing it up is a host-side job — see DOCKER.md.

name: reise-blog

services:
  emdash:
    build: .
    restart: unless-stopped
    ports:
      - "4321:4321"
    volumes:
      - data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/_emdash/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  data:
